services:
  toolchain:
    image: blissey-beacon-toolchain:dev
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - backend_dependencies:/workspace/apps/backend/node_modules
      - web_dependencies:/workspace/apps/web/node_modules
      - contracts_dependencies:/workspace/packages/contracts/node_modules
      - pnpm_store:/pnpm/store
    environment:
      CI: "true"
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm/store && pnpm check"
  backend:
    extends: toolchain
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    command: pnpm dev:backend
  web:
    extends: toolchain
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    command: pnpm --filter @blissey/web dev --host 0.0.0.0
  test-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: synthetic-test-only
      POSTGRES_DB: foundation_test
    command: postgres -c wal_level=logical
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foundation_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  verify:
    extends: toolchain
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@test-db:5432/foundation_test
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm/store && pnpm check && pnpm test:db"
volumes:
  dependencies:
  backend_dependencies:
  web_dependencies:
  contracts_dependencies:
  pnpm_store:
